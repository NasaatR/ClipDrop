name: Windows build and checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Chrome companion behavior and permissions
        run: node --test tests/browser/downloads.test.mjs
      - name: Core data and recovery checks
        run: dotnet run --project tests/ClipDrop.Core.Tests -c Release
      - name: Windows transfer, clipboard and WPF rendering checks
        run: dotnet run --project tests/ClipDrop.Windows.Tests -c Release -- artifacts/qa
      - name: Build runnable package
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Published Chrome native messaging protocol
        shell: pwsh
        run: ./scripts/test-browser-host.ps1
      - name: Real Chrome download to a custom save folder
        shell: pwsh
        run: ./scripts/test-chrome.ps1
      - name: Published app startup and graceful shutdown
        shell: pwsh
        run: |
          $app = Start-Process './artifacts/publish/ClipDrop.exe' -ArgumentList '--background', '--check-startup' -RedirectStandardError './artifacts/startup-errors.txt' -PassThru
          try {
            Start-Sleep -Seconds 2
            if ($app.HasExited) { Get-Content './artifacts/startup-errors.txt'; throw "Published app exited during startup: $($app.ExitCode)" }
            $quit = Start-Process './artifacts/publish/ClipDrop.exe' -ArgumentList '--quit' -PassThru -Wait
            if ($quit.ExitCode -ne 0 -or !$app.WaitForExit(10000)) { throw 'Published app did not shut down through its command channel' }
            if ($app.ExitCode -ne 0) { throw "Published app failed: $($app.ExitCode)" }
          } finally { if (!$app.HasExited) { Stop-Process -Id $app.Id -Force } }
      - name: Previous-version upgrade and uninstaller check
        shell: pwsh
        run: ./scripts/test-install.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ui-captures
          path: artifacts/qa
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ClipDrop-windows-x64
          path: artifacts/release/*
          if-no-files-found: error
  release:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ClipDrop-windows-x64
          path: release
      - name: Publish new version without replacing issued assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(python3 -c 'import xml.etree.ElementTree as e; print(e.parse("Directory.Build.props").findtext(".//VersionPrefix"))')
          tag="v$version"
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "A newer main commit exists; skipping this superseded build."
            exit 0
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; issued assets are preserved."
          else
            gh release create "$tag" release/* --target "$GITHUB_SHA" --title "ClipDrop $version — Windows preview" --prerelease --notes-file docs/RELEASE.md
          fi
